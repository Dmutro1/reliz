<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Page</title>
    <style>
        :root {
            color-scheme: dark;
            background-color: #190602;
            color: #ffe9b4;
            --surface: #340f0b;
            --surface-strong: #5a140f;
            --border: #b23019;
            --text-muted: #ffe3a3;
            --accent: #ffcd3f;
            --accent-strong: #ff3300;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: radial-gradient(circle at top left, rgba(255, 181, 39, 0.18), transparent 20%),
                        linear-gradient(180deg, #220703 0%, #0b0201 100%);
            color: #f8e1a6;
            line-height: 1.6;
        }

        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px 24px 40px;
        }

        header {
            margin: 0 auto 32px;
            padding: 28px 32px 24px;
            background: linear-gradient(135deg, rgba(255, 207, 94, 0.22), rgba(79, 19, 8, 0.94));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 181, 39, 0.45);
            box-shadow: 0 32px 96px rgba(255, 111, 0, 0.16);
            border-radius: 26px;
            display: grid;
            gap: 20px;
            position: relative;
            top: -20px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-actions {
            display: flex;
            align-items: center;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, #ffdc5c, #ff9a1e);
            display: grid;
            place-items: center;
            color: #1a0400;
            font-weight: 800;
            font-size: 1.45rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.11);
        }

        .brand-title {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.03em;
        }

        .brand-subtitle {
            margin: 4px 0 0;
            color: var(--text-muted);
            font-size: 0.98rem;
        }

        .header-actions {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .dropdown {
            min-width: 250px;
            max-width: 100%;
            padding: 16px 22px;
            border-radius: 28px;
            border: 1px solid rgba(255, 181, 39, 0.65);
            background: linear-gradient(145deg, rgba(255, 145, 40, 0.42), rgba(44, 16, 6, 0.94));
            color: #fff1ce;
            font-size: 1rem;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 30px 90px rgba(255, 138, 0, 0.18);
        }

        .dropdown:hover,
        .dropdown:focus {
            transform: translateY(-3px);
            background: linear-gradient(145deg, rgba(255, 110, 20, 0.8), rgba(57, 18, 5, 0.96));
            border-color: rgba(255, 144, 25, 0.95);
            box-shadow: 0 34px 98px rgba(255, 103, 0, 0.28);
        }

        .dropdown::-ms-expand {
            filter: invert(1);
        }

        .dropdown option {
            background-color: #2f0f05;
            color: #ffebae;
        }

        .dropdown::after {
            content: '';
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 2.5vw, 3rem);
            color: #ffffff;
        }

        p {
            margin: 0;
            color: var(--text-muted);
        }

        section {
            margin-bottom: 24px;
            padding: 24px;
            background: radial-gradient(circle at top left, rgba(255, 165, 40, 0.16), rgba(52, 14, 6, 0.96));
            border: 1px solid rgba(255, 165, 45, 0.5);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.12);
        }

        h2 {
            margin-top: 0;
            color: #ffb527;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .content-grid {
            display: grid;
            gap: 16px;
        }

        .content-card {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: linear-gradient(135deg, rgba(52, 14, 6, 0.6), rgba(35, 10, 8, 0.6));
            border: 1px solid rgba(255, 181, 39, 0.15);
            border-radius: 14px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .content-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 181, 39, 0.35);
            box-shadow: 0 8px 24px rgba(255, 111, 0, 0.15);
        }

        .content-icon {
            width: 64px;
            height: 64px;
            min-width: 64px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffdc5c, #ff9a1e);
            display: grid;
            place-items: center;
            color: #1a0400;
            font-weight: 800;
            font-size: 1.8rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.11);
            object-fit: cover;
        }

        .content-icon img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .content-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .content-header {
            margin: 0;
        }

        .content-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .content-desc {
            margin: 4px 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .content-meta {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .meta-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: rgba(255, 181, 39, 0.1);
            border: 1px solid rgba(255, 181, 39, 0.2);
            border-radius: 6px;
            color: #ffcd3f;
            font-weight: 500;
        }

        .meta-stat {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
        }

        .meta-author {
            color: var(--text-muted);
        }

        li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li:last-child {
            margin-bottom: 0;
        }
        #logout-btn, #login-btn, #register-btn {
            padding: 10px 20px;
            border-radius: 28px;
            border: 1px solid rgba(255, 181, 39, 0.65);
            background: linear-gradient(145deg, rgba(255, 145, 40, 0.42), rgba(44, 16, 6, 0.94));
            color: #fff1ce;
            font-size: 1rem;
            text-decoration: none;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 30px 90px rgba(255, 138, 0, 0.18);
            cursor: pointer;
        }

        #logout-btn:hover, #login-btn:hover, #register-btn:hover {
            transform: translateY(-2px);
            border-color: #ffdc5c;
            background: linear-gradient(145deg, rgba(255, 174, 48, 0.64), rgba(75, 22, 7, 0.96));
            box-shadow: 0 12px 28px rgba(255, 138, 0, 0.24);
        }

        .navbar-text {
            padding: 9px 4px;
            color: #ffdc5c;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .navbar-text:hover {
            color: #fff8df;
            transform: translateY(-1px);
        }

        .logout-form {
            margin: 0;

        }
        .register {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            padding-top: 15px;

        }

        main {
            min-height: 55vh;
        }

        .auth-page {
            display: grid;
            place-items: center;
            padding: 10px 0 48px;
        }

        .auth-card {
            width: min(100%, 520px);
            padding: 38px;
            background: linear-gradient(145deg, rgba(70, 19, 9, 0.96), rgba(30, 8, 5, 0.98));
            border: 1px solid rgba(255, 181, 39, 0.42);
            border-radius: 22px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3), 0 0 45px rgba(255, 111, 0, 0.08);
        }

        .auth-kicker {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .auth-title {
            margin: 0;
            color: #fff8df;
            font-size: clamp(1.8rem, 4vw, 2.35rem);
            line-height: 1.15;
        }

        .auth-description {
            margin: 10px 0 28px;
            color: var(--text-muted);
        }

        .auth-form p {
            display: grid;
            gap: 8px;
            margin: 0 0 18px;
        }

        .auth-form label {
            color: #ffe9b4;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .auth-form input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 181, 39, 0.28);
            border-radius: 10px;
            background: rgba(14, 4, 2, 0.62);
            color: #fff8df;
            font: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .auth-form input:focus {
            border-color: var(--accent);
            background: rgba(14, 4, 2, 0.82);
            box-shadow: 0 0 0 3px rgba(255, 205, 63, 0.14);
        }

        .auth-form ul {
            margin: 0;
            padding: 0;
            color: #ffad88;
            font-size: 0.82rem;
            list-style: none;
        }

        .auth-form .helptext {
            color: rgba(255, 227, 163, 0.7);
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .auth-error {
            margin: 0 0 18px;
            padding: 11px 13px;
            border: 1px solid rgba(255, 117, 82, 0.45);
            border-radius: 10px;
            background: rgba(119, 25, 9, 0.3);
            color: #ffc0a7;
            font-size: 0.88rem;
        }

        .auth-submit {
            width: 100%;
            margin-top: 4px;
            padding: 13px 18px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffdc5c, #ff9a1e);
            color: #2b0800;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 138, 0, 0.24);
        }

        .auth-switch {
            margin: 24px 0 0;
            color: rgba(255, 227, 163, 0.76);
            font-size: 0.9rem;
            text-align: center;
        }

        .auth-switch a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-switch a:hover {
            text-decoration: underline;
        }

        .profile-card {
            max-width: 560px;
            text-align: center;
        }

        .profile-avatar {
            width: 76px;
            height: 76px;
            margin: 4px auto 20px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #ffdc5c, #ff9a1e);
            color: #2b0800;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(255, 138, 0, 0.2);
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-form {
            display: grid;
            gap: 12px;
            margin: 0 auto 32px;
            text-align: left;
        }

        .avatar-label {
            color: #ffe9b4;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .avatar-hint {
            margin: -6px 0 0;
            color: rgba(255, 227, 163, 0.62);
            font-size: 0.78rem;
        }

        .avatar-form input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px dashed rgba(255, 181, 39, 0.42);
            border-radius: 10px;
            background: rgba(14, 4, 2, 0.42);
            color: var(--text-muted);
            font: inherit;
        }

        .avatar-form input[type="file"]::file-selector-button {
            margin-right: 10px;
            padding: 9px 14px;
            border: 0;
            border-radius: 7px;
            background: rgba(255, 205, 63, 0.16);
            color: #ffe9b4;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .avatar-form input[type="file"]::file-selector-button:hover {
            background: rgba(255, 205, 63, 0.28);
            color: #fff8df;
        }

        .profile-action-button,
        .profile-home-link {
            display: block;
            width: 100%;
            padding: 12px 18px;
            border: 1px solid rgba(255, 181, 39, 0.65);
            border-radius: 10px;
            background: linear-gradient(135deg, #ffdc5c, #ff9a1e);
            color: #2b0800;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .profile-action-button:hover,
        .profile-home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(255, 138, 0, 0.24);
        }

        .profile-details {
            margin: 28px 0;
            text-align: left;
        }

        .profile-details div {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 181, 39, 0.16);
        }

        .profile-details dt {
            color: rgba(255, 227, 163, 0.7);
            font-size: 0.88rem;
        }

        .profile-details dd {
            margin: 0;
            color: #fff8df;
            font-weight: 600;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .profile-home-link {
            background: transparent;
            color: var(--accent);
        }

        .home-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
        }

        .home-pagination a,
        .home-pagination span {
            padding: 7px 12px;
            border: 1px solid rgba(255, 181, 39, 0.4);
            border-radius: 8px;
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
        }

        .home-pagination a:hover {
            background: rgba(255, 181, 39, 0.14);
        }

        @media (max-width: 560px) {
            .auth-card {
                padding: 28px 22px;
            }

            .profile-details div {
                align-items: flex-start;
                flex-direction: column;
                gap: 4px;
            }

            .profile-details dd {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="brand">
                <div class="brand-icon">S</div>
                <div>
                    <h1 class="brand-title">System33</h1>
                    <p class="brand-subtitle">Platform for mods, texture packs, shaders, and worlds.</p>
                    
                </div>
            </div>
                <div class="register">
                    {% if user.is_authenticated %}
                        <a class="navbar-text text-muted me-3" href="{% url 'profile' %}">{{ user.username }}</a>
                        <form method="post" action="{% url 'logout' %}" class="logout-form">
                            {% csrf_token %}
                            <button type="submit" id="logout-btn">Log out</button>
                        </form>
                    {% else %}
                        <a class="btn btn-outline-secondary me-2" id="register-btn" href="{% url 'register' %}">Register</a>
                        <a class="btn btn-primary" id="login-btn" href="{% url 'login' %}">Log in</a>
                    {% endif %}
                </div>
            <div class="header-actions">
                
                <select class="dropdown" onchange="if(this.value) window.location.href=this.value;">
                    <option value="">Discover content</option>
                    <option value="/mods/">Mods</option>
                    <option value="/texture-packs/">Texture Packs</option>
                    <option value="/modpacks/">Modpacks</option>
                    <option value="/worlds/">Worlds</option>
                    <option value="/shaders/">Shaders</option>
                </select>
            </div>
        </div>
    </header>

    <main>  
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        {% include 'footer.html' %}
    </footer>
</html>
