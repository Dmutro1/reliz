{% extends 'home.html' %}

{% block content %}
<div class="auth-page">
    <section class="auth-card">
        <p class="auth-kicker">Start exploring</p>
        <h2 class="auth-title">Create an account</h2>
        <p class="auth-description">Join the community and discover new worlds for your game.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="auth-error">{{ form.non_field_errors }}</div>
            {% endif %}
            {{ form.as_p }}
            <button type="submit" class="auth-submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </section>
</div>
{% endblock %}
