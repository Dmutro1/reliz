{% extends 'home.html' %}

{% block content %}
<div class="auth-page">
    <section class="auth-card">
        <p class="auth-kicker">System33 account</p>
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-description">Log in to save your favorite mods and manage your content.</p>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="auth-error">{{ form.non_field_errors }}</div>
            {% endif %}
            {{ form.as_p }}
            <button type="submit" class="auth-submit">Log in</button>
        </form>
        <p class="auth-switch">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </section>
</div>
{% endblock %}
